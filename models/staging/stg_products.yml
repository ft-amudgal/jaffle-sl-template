models:
  - name: stg_products
    description: "Product (food and drink items that can be ordered) data with basic cleaning and transformation applied, one row per product. Product dimension table. The grain of the table is one row per product.\n"
    columns:
      - name: product_id
        description: The unique key for each product.
        tests:
          - not_null
          - unique

        entity:
          type: primary
          name: product
      - name: product_name
        dimension:
          type: categorical
      - name: product_type
        dimension:
          type: categorical
      - name: product_description
        dimension:
          type: categorical
      - name: is_food_item
        dimension:
          type: categorical
      - name: is_drink_item
        dimension:
          type: categorical
      - name: product_price
        dimension:
          type: categorical
    semantic_model:
      enabled: true
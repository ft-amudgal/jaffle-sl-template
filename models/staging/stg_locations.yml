models:
  - name: stg_locations
    description: "List of open locations with basic cleaning and transformation applied, one row per location. Location dimension table. The grain of the table is one row per location.\n"
    columns:
      - name: location_id
        description: The unique key for each location.
        tests:
          - not_null
          - unique

        entity:
          type: primary
          name: location
      - name: location_name
        dimension:
          type: categorical
      - name: opened_at
        dimension:
          type: time
        granularity: day
    semantic_model:
      enabled: true
      name: stg_locations
    agg_time_dimension: opened_at
    metrics:
      - name: average_tax_rate
        description: Average tax rate.
        expr: tax_rate
        agg: average
        type: simple
        hidden: true
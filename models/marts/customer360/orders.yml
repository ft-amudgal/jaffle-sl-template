models:
  - name: orders
    description: "Order overview data mart, offering key details for each order inlcluding if it's a customer's first order and a food vs. drink item breakdown. One row per order. Order fact table. This table is at the order grain with one row per order.\n"
    columns:
      - name: order_id
        description: The unique key of the orders mart.
        tests:
          - not_null
          - unique
        entity:
          type: primary
      - name: customer_id
        description: The foreign key relating to the customer who placed the order.
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
        entity:
          type: foreign
          name: customer
      - name: location_id
        description: The foreign key relating to the location the order was placed at.
        entity:
          type: foreign
          name: location
      - name: order_total
        description: The total amount of the order in USD including tax.
        dimension:
          type: categorical
          name: order_total_dim
      - name: ordered_at
        description: The timestamp the order was placed at.
        dimension:
          type: time
          name: ordered_at_test
        granularity: day
      - name: count_food_items
        description: The number of individual food items ordered.
      - name: count_drink_items
        description: The number of individual drink items ordered.
      - name: count_items
        description: The total number of both food and drink items ordered.
      - name: subtotal_food_items
        description: The sum of all the food item prices without tax.
      - name: subtotal_drink_items
        description: The sum of all the drink item prices without tax.
      - name: subtotal
        description: The sum total of both food and drink item prices without tax.
      - name: order_cost
        description: The sum of supply expenses to fulfill the order.
      - name: location_name
        description: The full location name of where this order was placed. Denormalized from `stg_locations`.
      - name: is_first_order
        description: A boolean indicating if this order is from a new customer placing their first order.
      - name: is_food_order
        description: A boolean indicating if this order included any food items.
        dimension:
          type: categorical
      - name: is_drink_order
        description: A boolean indicating if this order included any drink items.
        dimension:
          type: categorical
    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    derived_semantics:
      entities: []
      dimensions:
        - name: ordered_at
          type: time
          granularity: day
          expr: cast(ordered_at as DATE)
    metrics:
      - name: customers_with_orders
        description: "Distict count of customers placing orders"
        type: simple
        label: Customers w/ Orders
        agg: count_distinct
        expr: customer_id
      - name: new_customer
        description: Unique count of new customers.
        label: New Customers
        type: simple
        filter: |
          {{ Dimension('customer__customer_type') }}  = 'new'

        agg: count_distinct
        expr: customer_id
      - name: order_cost
        description: Sum of cost for each order item.
        label: Order Cost
        type: simple
        agg: sum
      - name: order_total
        description: Sum of total order amonunt. Includes tax + revenue.
        type: simple
        label: Order Total
        agg: sum
      - name: large_order
        description: "Count of orders with order total over 20."
        type: simple
        label: "Large Orders"
        filter: |
          {{ Dimension('order_id__order_total_dim') }} >= 20
        agg: sum
        expr: 1
      - name: orders
        description: Count of orders.
        label: Orders
        type: simple
        agg: sum
        expr: 1
      - name: orders_fill_nulls_with_zero
        description: Example metric colaescing null to zero.
        label: Orders (Fill nulls with 0)
        type: simple
        agg: sum
        expr: 1
        fill_nulls_with: 0
        join_to_timespine: true
      - name: food_orders
        description: Count of orders that contain food order items
        label: Food Orders
        type: simple
        # test
        filter: |
          {{ Dimension('order_id__is_food_order') }} = true
        agg: sum
        expr: 1
      - name: tax_paid
        description: The total tax paid on each order.
        agg: sum
        type: simple
        hidden: true
      - name: locations_with_orders
        description: Distinct count of locations with order
        expr: location_id
        agg: count_distinct
        type: simple
        hidden: true
      - name: twice_orders_fill_nulls_with_0
        description: Example derived metric.
        label: Twice Orders
        type: derived
        expr: 2 * orders_fill_nulls_with_zero
        input_metrics:
          - name: orders_fill_nulls_with_zero
      - name: order_count
        expr: 1
        agg: sum
        type: simple
        hidden: true
      - name: orders_last_7_days
        description: Count of orders.
        label: orders last 7 days
        type: cumulative
        window: 7 days
        input_metric: order_count
models:
  - name: customers
    description: 'Customer overview data mart, offering key details for each unique customer. This contains one row per customer. Customer grain mart.

      '
    columns:
      - name: customer_id
        description: The unique key of the orders mart.
        tests:
          - not_null
          - unique
        entity:
          type: primary
          name: customer
      - name: customer_name
        description: Customers full name.
        dimension:
          type: categorical
      - name: count_lifetime_orders
        description: Total number of orders a customer has ever placed.
      - name: first_ordered_at
        description: The timestamp when a customer placed their first order.
      - name: last_ordered_at
        description: The timestamp of a customer's most recent order.
        dimension:
          type: time
        granularity: day
      - name: lifetime_spend_pretax
        description: The sum of all the pre-tax subtotals of every order a customer has placed.
      - name: lifetime_spend
        description: The sum of all the order totals (including tax) that a customer has ever placed.
      - name: customer_type
        description: Options are 'new' or 'returning', indicating if a customer has ordered more than once or has only placed their first order to date.
        tests:
          - accepted_values:
              arguments:
                values: ["new", "returning"]

        dimension:
          type: categorical
    semantic_model:
      enabled: true
    agg_time_dimension: first_ordered_at
    derived_semantics:
      entities: []
      dimensions:
        - name: first_ordered_at
          type: time
          granularity: day
          expr: cast(first_ordered_at as DATE)
    metrics:
      - name: count_lifetime_orders
        description: Total count of orders per customer.
        agg: sum
        type: simple
        hidden: true
      - name: lifetime_spend_pretax
        description: Customer lifetime spend before taxes.
        agg: sum
        type: simple
        hidden: true
      - name: lifetime_spend
        agg: sum
        description: Gross customer lifetime spend inclusive of taxes.

        type: simple
        hidden: true
saved_queries:
  - name: new_customer_orders
    description: New customer orders by name and time
    query_params:
      metrics:
        - orders
      group_by:
        - Dimension('customer__customer_name')
        - TimeDimension('metric_time', 'day')
      where:
        - "{{ Dimension('customer__customer_type') }}  = 'new'"
    exports:
      - name: new_customer_orders
        config:
          export_as: table
      - name: new_customer_orders_view
        config:
          export_as: view
          alias: new_customer_orders_export_alias
groups:
  - name: finance
    owner:
      # 'name' or 'email' is required; additional properties allowed
      email: finance@jaffleshop.com
    config:
      meta:
        slack: finance-data
        github: finance-data-team
metrics:
  # Simple metrics
  - name: order_gross_profit
    description: Gross profit from each order.
    type: derived
    label: Order Gross Profit
    expr: revenue - cost
    input_metrics:
      - name: revenue
      - name: order_cost
        alias: cost

  #Cumulative Metrics
saved_queries:
  - name: order_metrics
    label: order metrics
    description: Relevant order metrics
    query_params:
      metrics:
        - orders
        - large_order
        - food_orders
        - order_total
      group_by:
        - Entity('order_id')
        - TimeDimension('metric_time', 'day')
        - Dimension('customer__customer_name')
        - Dimension('customer__customer_type')
        - TimeDimension('customer__first_ordered_at', 'day')
    exports:
      - name: order_data_key_metrics
        config:
          export_as: table
    config:
      cache:
        enabled: true
  - name: weekly_revenue
    label: weekly revenue
    description: Weekly revenue
    query_params:
      metrics:
        - revenue
      group_by:
        - TimeDimension('metric_time', 'week')
    exports:
      - name: weekly_revenue
        config:
          export_as: table
  - name: total_orders_full_aggregate
    description: All orders placed
    query_params:
      metrics:
        - orders
models:
  - name: order_items
    semantic_model:
      enabled: true
      name: order_items
    description: |
      Items contatined in each order. The grain of the table is one row per order item.
    agg_time_dimension: ordered_at
    columns:
      - name: order_item_id
        entity:
          type: primary
          name: order_item
      - name: order_id
        entity:
          type: foreign
      - name: product_id
        entity:
          type: foreign
          name: product
      - name: is_food_item
        dimension:
          type: categorical
      - name: is_drink_item
        dimension:
          type: categorical
    derived_semantics:
      entities: []
      dimensions:
        - name: ordered_at
          type: time
          granularity: day
          expr: cast(ordered_at as DATE)
    metrics:
      - name: revenue
        description: Sum of the product revenue for each order item. Excludes tax.
        type: simple
        label: Revenue
        agg: sum
        expr: product_price
        fill_nulls_with: 0
      - name: median_revenue
        description: The median revenue for each order item. Excludes tax.
        type: simple
        label: Median Revenue
        agg: percentile
        expr: product_price
        percentile: 0.5
        percentile_type: continuous
      - name: food_revenue
        description: The revenue from food in each order
        label: Food Revenue
        type: simple
        agg: sum
        expr: case when is_food_item = 1 then product_price else 0 end
      - name: average_revenue
        description: The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each product in an order.
        agg: average
        expr: product_price
        type: simple
      - name: drink_revenue
        description: The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each product in an order.
        agg: sum
        expr: case when is_drink_item = 1 then product_price else 0 end
        type: simple
        hidden: true
      - name: food_revenue_pct
        description: The % of order revenue from food.
        label: Food Revenue %
        type: ratio
        numerator: food_revenue
        denominator: revenue
      - name: revenue_growth_mom
        description: "Percentage growth of revenue compared to 1 month ago. Excluded tax"
        type: derived
        label: Revenue Growth % M/M
        expr: (current_revenue - revenue_prev_month)*100/revenue_prev_month
        input_metrics:
          - name: revenue
            alias: current_revenue
          - name: revenue
            offset_window: 1 month
            alias: revenue_prev_month
      - name: revenue_1
        description: The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each product in an order.
        agg: sum
        expr: product_price
        type: simple
        hidden: true
      - name: cumulative_revenue
        description: The cumulative revenue for all orders.
        label: Cumulative Revenue (All Time)
        type: cumulative
        input_metric: revenue_1